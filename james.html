    <script>
        const images = document.querySelectorAll('img');

        function updateImageVisibility() {
            const windowHeight = window.innerHeight;

            images.forEach(img => {
                const rect = img.getBoundingClientRect();
                const imageTop = rect.top;
                const imageBottom = rect.bottom;

                // Check if image is in viewport
                if (imageBottom > 0 && imageTop < windowHeight) {
                    // Calculate how much of the image is visible (0 to 1)
                    const visibleStart = Math.max(0, -imageTop);
                    const visibleEnd = Math.min(rect.height, windowHeight - imageTop);
                    const visibleAmount = (visibleEnd - visibleStart) / rect.height;

                    // Only fully visible or mostly visible
                    if (visibleAmount > 0.3) {
                        img.classList.remove('fade-out');
                        img.classList.add('fade-in');
                    } else {
                        img.classList.remove('fade-in');
                        img.classList.add('fade-out');
                    }
                } else {
                    // Image is out of viewport
                    img.classList.remove('fade-in');
                    img.classList.add('fade-out');
                }
            });
        }

        // Run on scroll
        window.addEventListener('scroll', updateImageVisibility, { passive: true });

        // Initial check on page load
        window.addEventListener('load', updateImageVisibility);
        updateImageVisibility();
    </script>
