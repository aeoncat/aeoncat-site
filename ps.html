<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For James ❤️</title>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
            overflow: hidden;

            background:
                radial-gradient(800px 500px at 20% 20%, rgba(234, 128, 176, .18), transparent 60%),
                radial-gradient(700px 500px at 80% 70%, rgba(255, 255, 255, .08), transparent 55%),
                linear-gradient(135deg, #090913, #140a16);
        }

        /* BIG romantic button */
        .play-btn {
            width: 190px;
            height: 190px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .2);
            background: rgba(234, 128, 176, .15);
            display: grid;
            place-items: center;
            cursor: pointer;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, .6),
                0 0 0 10px rgba(234, 128, 176, .07);

            transition: .2s;

            animation: breathe 3s infinite;
        }

        @keyframes breathe {
            0% {
                box-shadow: 0 0 0 0 rgba(234, 128, 176, .25);
            }

            70% {
                box-shadow: 0 0 0 25px rgba(234, 128, 176, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(234, 128, 176, 0);
            }
        }



        .play-btn:hover {
            transform: translateY(-3px);
        }

        .play-btn:active {
            transform: translateY(0);
        }

        /* triangle */
        .play-icon {
            width: 0;
            height: 0;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-left: 36px solid white;
            margin-left: 8px;
        }
    </style>
</head>

<body>

    <button class="play-btn" onclick="playAudio()">
        <div class="play-icon"></div>
    </button>

    <audio id="voice">
        <source src="audio/for-james.mp3" type="audio/mpeg">
    </audio>

    <script>

        // popup immediately
        window.onload = () => {
            alert("Put your headphones in ❤️");
        };

        function playAudio() {
            document.getElementById("voice").play();
        }

    </script>

</body>

</html>
